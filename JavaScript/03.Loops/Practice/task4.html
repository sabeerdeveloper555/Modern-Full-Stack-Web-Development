<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    <script>
        // Check whether a number is a Perfect Number.

        /*
        Perfect Number: A number is called perfect if the sum of its divisors (excluding itself) is equal to the number.
        */

        let userInput = Number(prompt("Enter a number: "))

        let midValue = parseInt(userInput / 2);

        let sum = 0;

        for (let i = 1; i <= midValue; i++) {
            if (userInput % i === 0) {
                console.log(i);
                sum += i;
            }
        }
        // console.log(`Sum = ${sum}`);

        if (sum === userInput) {
            console.log(`${userInput}, Sum = ${sum} Perfect Number.`)
        } else {
            console.log(`${userInput}, Sum = ${sum} not a Perfect Number.`)
        }
    </script>
</body>

</html>
