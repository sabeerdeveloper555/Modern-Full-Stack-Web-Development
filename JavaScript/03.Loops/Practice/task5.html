<body>
    <script>
        // Reverse a number using a while loop.

        let num = 12345;

        let reverseNumber = 0;

        while (num > 0) {
            let lastDigit = num % 10;
            reverseNumber = reverseNumber * 10 + lastDigit;
            num = parseInt(num / 10);
        }
        console.log(reverseNumber);
    </script>
</body>

</html>
