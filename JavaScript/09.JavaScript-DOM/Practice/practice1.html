<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Welcome to JS DOM</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur, adipisicing elit. Odio quaerat
      aut, hic temporibus numquam nemo. Dolore explicabo autem cupiditate
      expedita molestias nam. Commodi obcaecati sequi ut beatae itaque
      voluptatibus deserunt.
    </p>
    <button>Swap</button>
  </body>
  <script>
    let btn = document.querySelector("button");
    let headingElement = document.querySelector("h1");
    let paraElement = document.querySelector("p");

    btn.addEventListener("click", () => {
      headingElementData = headingElement.innerHTML;
      paraElementData = paraElement.innerHTML;

      headingElement.innerHTML = paraElementData;

      paraElement.innerHTML = headingElementData;
    });
  </script>
</html>
