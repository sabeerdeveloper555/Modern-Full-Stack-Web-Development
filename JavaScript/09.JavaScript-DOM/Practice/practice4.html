<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Character Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <style>
      /* =========================
         RESET
      ========================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
      }

      /* =========================
         MAIN CONTAINER
      ========================== */

      .main {
        width: 100%;
        max-width: 900px;
        background: #ffffff;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      }

      /* =========================
         HEADING
      ========================== */

      .main h1 {
        text-align: center;
        font-size: 32px;
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 8px;
      }

      .description {
        text-align: center;
        color: #64748b;
        font-size: 14px;
        margin-bottom: 25px;
      }

      /* =========================
         TEXTAREA
      ========================== */

      .main textarea {
        display: block;
        width: 100%;
        height: 220px;
        resize: vertical;
        padding: 18px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        outline: none;
        font-size: 16px;
        line-height: 1.6;
        color: #334155;
        background-color: #f8fafc;
        transition: all 0.3s ease;
      }

      .main textarea::placeholder {
        color: #94a3b8;
      }

      .main textarea:focus {
        border-color: #6366f1;
        background-color: #ffffff;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
      }

      /* =========================
         COUNTER
      ========================== */

      .counter {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 18px;
        margin-bottom: 15px;
      }

      .counter h2 {
        font-size: 18px;
        font-weight: 600;
        color: #334155;
      }

      .counter span {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-width: 45px;
        padding: 4px 10px;
        border-radius: 20px;
        background: #6366f1;
        color: white;
        font-size: 14px;
      }

      /* =========================
         LIVE PREVIEW
      ========================== */

      .preview-title {
        font-size: 16px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 8px;
      }

      #responsive-div {
        min-height: 100px;
        padding: 18px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        color: #475569;
        font-size: 15px;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* =========================
         RESPONSIVE DESIGN
      ========================== */

      @media (max-width: 768px) {
        body {
          padding: 20px 12px;
        }

        .main {
          padding: 25px 20px;
          border-radius: 16px;
        }

        .main h1 {
          font-size: 26px;
        }

        .main textarea {
          height: 200px;
        }
      }

      @media (max-width: 480px) {
        .main {
          padding: 20px 15px;
        }

        .main h1 {
          font-size: 22px;
        }

        .description {
          font-size: 13px;
        }

        .main textarea {
          height: 180px;
          padding: 14px;
          font-size: 14px;
        }

        .counter h2 {
          font-size: 16px;
        }

        #responsive-div {
          font-size: 14px;
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="main">
      <textarea name="" id=""></textarea>

      <h2>Length - <span>0</span></h2>
      <div id="responsive-div"></div>
    </div>
  </body>
  <script>
    let textareaElement = document.querySelector("textarea");
    let lengthElement = document.querySelector("h2 span");
    let responsiveDivElement = document.querySelector("#responsive-div");

    textareaElement.addEventListener("keyup", () => {
      responsiveDivElement.innerHTML = textareaElement.value;

      lengthElement.innerHTML = textareaElement.value.length;
    });
  </script>
</html>
