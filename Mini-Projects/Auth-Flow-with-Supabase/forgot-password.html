
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forgot Password | AuthFlow</title>

    <!-- Font Awesome icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="auth-container">
      <!-- Left side: Forgot password form -->
      <section class="form-section">
        <div class="form-wrapper">
          <a class="auth-back-link" href="index.html">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            Back to login
          </a>

          <div class="auth-page-icon">
            <i class="fa-regular fa-envelope" aria-hidden="true"></i>
          </div>

          <h1>Forgot password?</h1>

          <p class="subtitle">
            No worries! Enter your registered email address and
            we'll send you a link to reset your password.
          </p>

          <form id="forgotPasswordForm">
            <div class="form-group">
              <label for="email">Email address</label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>

            <!-- Displays success and error messages -->
            <p id="message" role="status" aria-live="polite"></p>

            <button type="submit" id="resetPasswordBtn">
              Send reset link
            </button>
          </form>

          <p class="switch-text">
            Remember your password?
            <a href="index.html">Sign in</a>
          </p>
        </div>
      </section>

      <!-- Right side: Information panel -->
      <section class="illustration-section">
        <div class="illustration-content">
          <div class="illustration-icon">
            <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
          </div>

          <h2>Let's get you back in.</h2>

          <p>
            A few simple steps and you'll be back to your account.
            Your security matters to us.
          </p>
        </div>
      </section>
    </main>

    <!-- Supabase JavaScript library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase configuration -->
    <script src="js/supabase.js"></script>

    <!-- Forgot password functionality -->
    <script src="js/forgot-password.js"></script>
  </body>
</html>
