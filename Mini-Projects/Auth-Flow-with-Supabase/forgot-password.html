<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forgot Password | AuthFlow</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="auth-container">
      <h1>Forgot Password?</h1>

      <p>
        Enter your registered email address to receive a password reset link.
      </p>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />
        </div>

        <button type="submit" id="resetPasswordBtn">Send Reset Link</button>
      </form>

      <!-- Displays success and error messages -->
      <p id="message" role="status" aria-live="polite"></p>

      <p>
        Remember your password?
        <a href="index.html">Back to Login</a>
      </p>
    </main>

    <!-- Supabase JavaScript CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase client configuration -->
    <script src="js/supabase.js" defer></script>

    <!-- Forgot password functionality -->
    <script src="js/forgot-password.js" defer></script>
  </body>
</html>
