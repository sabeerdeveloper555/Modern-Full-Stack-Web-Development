<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Makes the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | AuthApp</title>

    <!-- Connects the external CSS file -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="auth-container">
      <!-- Left side: Login form -->
      <section class="form-section">
        <div class="form-wrapper">
          <h1>Welcome back</h1>
          <p class="subtitle">Sign in to continue to your account.</p>

          <form id="loginForm">
            <div class="form-group">
              <label for="email">Email address</label>
              <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                minlength="6"
              />
            </div>

            <!-- Displays validation and authentication messages -->
            <p id="message" role="status" aria-live="polite"></p>

            <button type="submit" id="loginBtn">Sign In</button>
          </form>

          <p class="switch-text">
            Don't have an account?
            <a href="signup.html">Create account</a>
          </p>
        </div>
      </section>

      <!-- Right side: Illustration panel -->
      <section class="illustration-section">
        <div class="illustration-content">
          <div class="illustration-icon">✦</div>
          <h2>Your journey starts here.</h2>
          <p>A simple, secure way to access your personal space.</p>
        </div>
      </section>
    </main>

    <!-- Supabase JavaScript library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Our Supabase configuration -->
    <script src="js/supabase.js"></script>

    <!-- Handle login functionality -->
    <script src="js/auth.js"></script>
  </body>
</html>
