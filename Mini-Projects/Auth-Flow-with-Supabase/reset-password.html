<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password | AuthFlow</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Supabase JavaScript CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase client configuration -->
    <script src="js/supabase.js" defer></script>

    <!-- Reset password functionality -->
    <script src="js/reset-password.js" defer></script>
  </head>

  <body>
    <main class="auth-container">
      <h1>Reset Password</h1>

      <p>Enter your new password below.</p>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>

          <input
            type="password"
            id="newPassword"
            name="newPassword"
            placeholder="Enter new password"
            autocomplete="new-password"
            minlength="6"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm new password"
            autocomplete="new-password"
            minlength="6"
            required
          />
        </div>

        <button type="submit" id="updatePasswordBtn">Update Password</button>
      </form>

      <!-- Displays success and error messages -->
      <p id="message" role="status" aria-live="polite"></p>

      <p>
        <a href="index.html">Back to Login</a>
      </p>
    </main>

      <!-- Supabase JavaScript CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase client configuration -->
    <script src="js/supabase.js" defer></script>

    <!-- Reset password functionality -->
    <script src="js/reset-password.js" defer></script>
  </body>
</html>
