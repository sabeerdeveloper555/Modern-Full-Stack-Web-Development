<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password | AuthFlow</title>

    <!-- Font Awesome icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="auth-container">
      <!-- Left side: Reset password form -->
      <section class="form-section">
        <div class="form-wrapper">
          <a class="auth-back-link" href="index.html">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            Back to login
          </a>

          <div class="auth-page-icon">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
          </div>

          <h1>Create new password</h1>

          <p class="subtitle">
            Choose a strong password that you haven't used before.
          </p>

          <form id="resetPasswordForm">
            <!-- New password field -->
            <div class="form-group">
              <label for="newPassword">New password</label>

              <div class="password-wrapper">
                <input
                  type="password"
                  id="newPassword"
                  name="newPassword"
                  placeholder="Enter new password"
                  autocomplete="new-password"
                  minlength="6"
                  required
                />

                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Show new password"
                  aria-pressed="false"
                  aria-controls="newPassword"
                >
                  <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <!-- Confirm password field -->
            <div class="form-group">
              <label for="confirmPassword">Confirm new password</label>

              <div class="password-wrapper">
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="Re-enter new password"
                  autocomplete="new-password"
                  minlength="6"
                  required
                />

                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Show confirmation password"
                  aria-pressed="false"
                  aria-controls="confirmPassword"
                >
                  <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <!-- Displays success and error messages -->
            <p id="message" role="status" aria-live="polite"></p>

            <button type="submit" id="updatePasswordBtn">
              Update password
            </button>
          </form>

          <p class="switch-text">
            Remember your password?
            <a href="index.html">Sign in</a>
          </p>
        </div>
      </section>

      <!-- Right side: Information panel -->
      <section class="illustration-section">
        <div class="illustration-content">
          <div class="illustration-icon">
            <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
          </div>

          <h2>Secure your account.</h2>

          <p>
            Set a new password to regain access to your account. Keep it private
            and choose something strong.
          </p>
        </div>
      </section>
    </main>

    <!-- Supabase JavaScript library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase configuration -->
    <script src="js/supabase.js"></script>

    <!-- Reset password functionality -->
    <script src="js/reset-password.js"></script>

    <!-- Show/Hide password functionality -->
    <script src="js/password-toggle.js"></script>
  </body>
</html>
